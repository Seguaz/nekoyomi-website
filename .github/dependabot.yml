version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    # Give the ecosystem time to catch malicious releases before we adopt them.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dependencies:
        update-types: [minor, patch]
