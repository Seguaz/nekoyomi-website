name: Deploy website

on:
  push:
    branches: [main]
  pull_request:
  # Daily rebuild so the download page and changelogs pick up new app releases.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# No permissions by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json

      # No dependency cache on purpose: every build starts clean (avoids cache poisoning).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          package-manager-cache: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build and verify
        env:
          # Read-only token, only used at build time to read public release data.
          GITHUB_TOKEN: ${{ github.token }}
          VITE_HOSTNAME: https://nekoyomi.seguaz.online
        run: pnpm test

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
          # Needed for /.well-known/security.txt
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only the official repository's main branch can deploy (never PRs or forks).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Seguaz/nekoyomi-website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
